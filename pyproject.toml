[project]
name = "forensight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.34",
    "numpy",
    "pandas",
    "Pillow",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
