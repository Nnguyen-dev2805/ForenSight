[project]
name = "forensight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.34",
    "kagglehub>=1.0",
    "numpy",
    "pandas",
    "Pillow",
    "scikit-learn",
    "torch",
    "torchvision",
    "open_clip_torch",
    "pyarrow",
    # Imported directly for the ImageNet-1k WNID table used to normalize
    # dataset class IDs. Already pulled in by open_clip_torch, but declared
    # explicitly because forensight now imports it rather than only inheriting it.
    "timm>=1.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
